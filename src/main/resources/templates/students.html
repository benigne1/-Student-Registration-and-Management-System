<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Students</title>
    <link rel="stylesheet" th:href="@{/style.css}">
</head>
<body>
<div class="container">
    <h2>Registered Students</h2>

    <p class="error" th:if="${message}" th:text="${message}"></p>
    <p th:if="${#lists.isEmpty(students) and message == null}">No students registered yet.</p>

    <div class="table-wrap" th:unless="${#lists.isEmpty(students)}">
        <table>
            <tr>
                <th>ID</th><th>First Name</th><th>Last Name</th><th>Email</th><th>Age</th>
            </tr>
            <tr th:each="s : ${students}">
                <td th:text="${s.id}"></td>
                <td th:text="${s.firstName}"></td>
                <td th:text="${s.lastName}"></td>
                <td th:text="${s.email}"></td>
                <td th:text="${s.age}"></td>
            </tr>
        </table>
    </div>

    <p><a th:href="@{/student/register}">Register a new student</a></p>
</div>
</body>
</html>
